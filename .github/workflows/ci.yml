name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app y las pruebas E2E
        id: build
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Pruebas unitarias
        id: unit
        run: ./gradlew testDebugUnitTest

      - name: Resultados de las pruebas unitarias
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        run: python3 .github/scripts/test_report.py "Pruebas unitarias" "app/build/test-results/testDebugUnitTest/*.xml"

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew lintDebug

      - name: Guardar reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: app/build/reports/
